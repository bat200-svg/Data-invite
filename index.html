<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Приглашение на свидание ✨</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 75, 43, 0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .gif-box img {
      width: 140px;
      height: 140px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 15px;
    }
    h1 { color: #ff4b2b; font-size: 22px; margin: 0 0 8px 0; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    .section-title {
      font-size: 14px;
      font-weight: bold;
      color: #444;
      margin: 15px 0 10px 0;
      text-align: left;
    }
    
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .opt-btn {
      background: #f7f7f7;
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 10px 5px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn.selected {
      border-color: #ff4b2b;
      background: #ffebe8;
      color: #ff4b2b;
      font-weight: bold;
    }

    .btn-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      margin-top: 20px;
      min-height: 50px;
    }
    .btn-main {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-yes {
      background: linear-gradient(45deg, #ff4b2b, #ff416c);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.3);
    }
    .btn-no {
      background: #e0e0e0;
      color: #555;
      position: absolute;
      right: 0;
      width: 48%;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="gif-box">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWp3OHU1aWR4bWRjcnh4bnByM3B5aDV2bnFhY3Bia3pvdnpxMW9ubCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cM2CN5UOXVLdMT2c40/giphy.gif" alt="Cutest Cat">
    </div>

    <h1>У меня есть предложение... ✨</h1>
    <p>Давай проведем время вместе! Выбери, что тебе больше по душе:</p>

    <div class="section-title">📍 Выбери вариант:</div>
    <div class="options" id="placeOptions">
      <div class="opt-btn selected" onclick="selectOpt(this, 'place')">☕ Уютная кофейня</div>
      <div class="opt-btn" onclick="selectOpt(this, 'place')">🍕 Вкусная пицца</div>
      <div class="opt-btn" onclick="selectOpt(this, 'place')">🎬 Прогулка/Кино</div>
      <div class="opt-btn" onclick="selectOpt(this, 'place')">🎲 Сюрприз!</div>
    </div>

    <div class="btn-container">
      <button class="btn-main btn-yes" onclick="sendResult()">ДА! ❤️</button>
      <button class="btn-main btn-no" id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">Нет</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedPlace = '☕ Уютная кофейня';

    function selectOpt(el, type) {
      document.querySelectorAll('#placeOptions .opt-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      selectedPlace = el.innerText;
    }

    function moveNoBtn() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);
      btn.style.position = 'fixed';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
    }

    function sendResult() {
      const payload = JSON.stringify({ place: selectedPlace });
      tg.sendData(payload);
      tg.close();
    }
  </script>
</body>
</html>
